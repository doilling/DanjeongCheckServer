name: Build DanjeongCheck Server Setup

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install production dependencies
        run: npm install --omit=dev

      - name: Prepare server distribution
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release_app | Out-Null
          Copy-Item server.js release_app
          Copy-Item run_server.cmd release_app
          Copy-Item install_autostart.cmd release_app
          Copy-Item stop_server.cmd release_app
          Copy-Item -Recurse public release_app\public
          Copy-Item -Recurse node_modules release_app
ode_modules
          $node = node -p "process.execPath"
          Copy-Item $node release_app
ode.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Build Windows Setup EXE
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: DanjeongCheck-Server-Setup
          path: release/DanjeongCheck_Server_Setup.exe
