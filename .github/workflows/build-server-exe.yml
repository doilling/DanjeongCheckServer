name: Build DanjeongCheck Test Server Setup
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev
      - shell: powershell
        run: |
          New-Item -ItemType Directory -Force release_app | Out-Null
          Copy-Item server.js,seed.json,run_server.cmd,install_autostart.cmd,stop_server.cmd release_app
          Copy-Item -Recurse public (Join-Path release_app "public")
          Copy-Item -Recurse node_modules (Join-Path release_app "node_modules")
          Copy-Item (node -p "process.execPath") (Join-Path release_app "node.exe")
      - shell: powershell
        run: choco install innosetup -y --no-progress
      - shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: DanjeongCheck-TestServer-Setup
          path: release/DanjeongCheck_Server_Setup.exe
