name: Windows EXE and installer
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test server integration
        run: python -m unittest discover -s tests -p test_server.py -v
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate JavaScript and PWA files
        run: |
          node --check static/app.js
          node --check static/sw.js
          node --check static/service-worker.js
          python tests/validate_pwa.py
      - name: Install UI test dependencies
        run: npm ci
      - name: Test UI with central HTTP server
        env:
          PYTHON: python
        run: npm run test:ui
      - name: Build bundled EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --name DanjeongCheck --add-data "static;static" server.py
      - name: Verify actual EXE and restart
        run: python tests/smoke_exe.py dist/DanjeongCheck.exe
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Sort-Object FullName | Select-Object -Last 1
          if (!$compiler) { throw 'Inno Setup compiler was not found.' }
          & $compiler.FullName installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Windows files
        uses: actions/upload-artifact@v4
        with:
          name: DanjeongCheck-Windows-5.0.7
          path: |
            dist/DanjeongCheck.exe
            installer-output/DanjeongCheck-Setup-5.0.7.exe
            scripts/*.ps1
            README.md
            PWA_SEPARATION_AND_REINSTALL.md
            README_SERVER_CACHE_UPDATE.txt
            Caddyfile_danjeong_cache_snippet.txt
            VALIDATION_PWA_20261025.txt
            WINDOWS_BUILD_REBUILD_REQUIRED.txt
          if-no-files-found: error
